<svg width="3200" height="2220" viewBox="0 0 1600 1110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Companion architecture</title>
  <desc id="desc">An architecture diagram: a parent host (Claude Code or Codex CLI) spawns a private Agent Companion subagent, which alone can see the agent-bridge MCP server. Inside the bridge, resolveRouting maps a strength or profile from profiles.json onto exactly one companion. One adapter per companion and transport then drives the work, and three of those transports hand off to detached machine-wide runtimes that outlive the bridge process. Everything is recorded in host-routed runtime state.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1600" y2="1110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6F7"/>
    </linearGradient>
    <linearGradient id="brand" x1="124" y1="116" x2="1476" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="540" y1="350" x2="1016" y2="654" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101C2F"/>
      <stop offset="1" stop-color="#0B1323"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-12%" width="120%" height="124%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#CBD5E1" stroke-opacity="0.33" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 56px; font-weight: 780; fill: #0F172A; }
      .subtitle { font-size: 23px; font-weight: 470; fill: #475569; }
      .eyebrow { font-size: 15px; font-weight: 780; fill: #0F766E; }
      .label { font-size: 27px; font-weight: 760; fill: #0F172A; }
      .labelDark { font-size: 27px; font-weight: 760; fill: #F8FAFC; }
      .body { font-size: 18px; font-weight: 500; fill: #475569; }
      .bodyDark { font-size: 18px; font-weight: 500; fill: #CBD5E1; }
      .code { font-size: 17px; font-weight: 680; fill: #334155; }
      .codeDark { font-size: 17px; font-weight: 680; fill: #DDE7F4; }
      .tiny { font-size: 14px; font-weight: 720; fill: #64748B; }
      .tinyDim { font-size: 13px; font-weight: 680; fill: #7C8AA0; }
      .pillTxt { font-size: 15px; font-weight: 720; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1600" height="1110" fill="url(#page)"/>
  <rect width="1600" height="1110" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="58" width="1440" height="1000" rx="34" fill="#FFFFFF" stroke="#D5E0EA"/>
  </g>
  <path d="M124 116H1476" stroke="url(#brand)" stroke-width="7" stroke-linecap="round"/>
  <text x="124" y="193" class="sans eyebrow">ARCHITECTURE</text>
  <text x="124" y="254" class="sans title">Subagent-isolated delegation</text>
  <text x="124" y="296" class="sans subtitle">The parent spawns one companion. Only that companion sees the private MCP bridge.</text>

  <!-- parent host -->
  <g filter="url(#softShadow)">
    <rect x="124" y="404" width="272" height="196" rx="24" fill="#F8FAFC" stroke="#CCD8E5"/>
  </g>
  <text x="158" y="454" class="sans label">Parent host</text>
  <rect x="158" y="486" width="104" height="34" rx="17" fill="#E0F2FE"/>
  <text x="176" y="509" class="mono tiny">Claude</text>
  <rect x="274" y="486" width="88" height="34" rx="17" fill="#E0E7FF"/>
  <text x="294" y="509" class="mono tiny">Codex</text>
  <text x="158" y="560" class="sans body">No direct MCP visibility</text>

  <path d="M412 502H518" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M504 487L524 502L504 517" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- subagent boundary + bridge -->
  <g filter="url(#shadow)">
    <rect x="540" y="350" width="476" height="304" rx="32" fill="url(#darkPanel)" stroke="#14B8A6" stroke-width="2"/>
  </g>
  <rect x="566" y="376" width="424" height="252" rx="24" fill="#0E1A2B" stroke="#2DD4BF" stroke-opacity="0.45" stroke-dasharray="9 9"/>
  <text x="596" y="426" class="sans labelDark">Agent Companion</text>
  <text x="596" y="457" class="sans bodyDark">Private subagent boundary</text>

  <rect x="596" y="480" width="180" height="42" rx="21" fill="#0F766E" fill-opacity="0.28" stroke="#2DD4BF" stroke-opacity="0.68"/>
  <text x="620" y="507" class="mono codeDark">agent_send</text>
  <rect x="790" y="480" width="166" height="42" rx="21" fill="#1D4ED8" fill-opacity="0.24" stroke="#60A5FA" stroke-opacity="0.64"/>
  <text x="815" y="507" class="mono codeDark">agent_wait</text>

  <rect x="596" y="534" width="360" height="40" rx="18" fill="#05111E" stroke="#60A5FA" stroke-opacity="0.68"/>
  <text x="628" y="560" class="mono codeDark">agent-bridge MCP server</text>

  <rect x="596" y="584" width="360" height="36" rx="16" fill="#05111E" stroke="#A78BFA" stroke-opacity="0.62"/>
  <text x="620" y="608" class="mono codeDark">resolveRouting -&gt; profiles.json</text>

  <path d="M1032 502H1136" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M1122 487L1142 502L1122 517" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- adapters -->
  <g filter="url(#softShadow)">
    <rect x="1162" y="350" width="314" height="304" rx="28" fill="#F8FAFC" stroke="#CCD8E5"/>
  </g>
  <text x="1198" y="402" class="sans label">Companion adapters</text>
  <text x="1198" y="432" class="sans body">One per companion × transport</text>

  <rect x="1198" y="460" width="242" height="54" rx="18" fill="#ECFEFF" stroke="#14B8A6"/>
  <circle cx="1226" cy="487" r="7" fill="#14B8A6"/>
  <text x="1246" y="482" class="mono code">opencode-runtime</text>
  <text x="1246" y="502" class="mono tinyDim">cli · server</text>

  <rect x="1198" y="524" width="242" height="54" rx="18" fill="#FFF7ED" stroke="#F59E0B"/>
  <circle cx="1226" cy="551" r="7" fill="#F59E0B"/>
  <text x="1246" y="546" class="mono code">copilot-runtime</text>
  <text x="1246" y="566" class="mono tinyDim">acp · sdk</text>

  <rect x="1198" y="588" width="242" height="54" rx="18" fill="#EEF0FF" stroke="#818CF8"/>
  <circle cx="1226" cy="615" r="7" fill="#818CF8"/>
  <text x="1246" y="610" class="mono code">codex-runtime</text>
  <text x="1246" y="630" class="mono tinyDim">exec · appserver</text>

  <path d="M1319 654V706" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <path d="M1299 690L1319 710L1339 690" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- detached shared runtimes -->
  <g filter="url(#softShadow)">
    <rect x="124" y="716" width="1352" height="124" rx="28" fill="#F1F5F9" stroke="#B9C7D6" stroke-dasharray="10 8"/>
  </g>
  <text x="158" y="764" class="sans label">Detached shared runtimes</text>
  <text x="158" y="796" class="sans body">Machine-wide; they outlive the bridge.</text>

  <rect x="700" y="756" width="240" height="52" rx="26" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="820" y="788" text-anchor="middle" class="mono pillTxt">copilot-acp-daemon</text>
  <rect x="956" y="756" width="240" height="52" rx="26" fill="#FFFFFF" stroke="#14B8A6"/>
  <text x="1076" y="788" text-anchor="middle" class="mono pillTxt">opencode serve</text>
  <rect x="1212" y="756" width="228" height="52" rx="26" fill="#FFFFFF" stroke="#818CF8"/>
  <text x="1326" y="788" text-anchor="middle" class="mono pillTxt">codex app-server</text>

  <!-- host-routed state -->
  <g filter="url(#softShadow)">
    <rect x="124" y="868" width="1352" height="104" rx="28" fill="#F8FAFC" stroke="#CCD8E5"/>
  </g>
  <text x="158" y="913" class="sans label">Host-routed runtime state</text>
  <text x="158" y="946" class="mono code">~/.claude/agent-companion/  |  ~/.codex/agent-companion/</text>

  <rect x="766" y="896" width="96" height="48" rx="24" fill="#E0F2FE"/>
  <text x="814" y="926" text-anchor="middle" class="mono tiny">jobs/</text>
  <rect x="872" y="896" width="112" height="48" rx="24" fill="#DCFCE7"/>
  <text x="928" y="926" text-anchor="middle" class="mono tiny">digests/</text>
  <rect x="994" y="896" width="112" height="48" rx="24" fill="#EDE9FE"/>
  <text x="1050" y="926" text-anchor="middle" class="mono tiny">threads/</text>
  <rect x="1116" y="896" width="152" height="48" rx="24" fill="#FCE7F3"/>
  <text x="1192" y="926" text-anchor="middle" class="mono tiny">profiles.json</text>
  <rect x="1278" y="896" width="162" height="48" rx="24" fill="#FEF3C7"/>
  <text x="1359" y="926" text-anchor="middle" class="mono tiny">default-target</text>

  <!-- invariants -->
  <rect x="124" y="986" width="508" height="52" rx="26" fill="#0F172A"/>
  <rect x="152" y="998" width="206" height="28" rx="14" fill="#17243A"/>
  <text x="255" y="1018" text-anchor="middle" class="mono codeDark">no silent fallback</text>
  <rect x="374" y="998" width="226" height="28" rx="14" fill="#17243A"/>
  <text x="487" y="1018" text-anchor="middle" class="mono codeDark">subagent-only MCP</text>
  <text x="664" y="1019" class="sans body">A strength resolves to exactly one profile, or the send returns a named error.</text>
</svg>
