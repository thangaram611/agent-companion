<svg width="3200" height="1700" viewBox="0 0 1600 850" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Companion companion capability matrix</title>
  <desc id="desc">A capability matrix of the five companion transports Agent Companion supports: OpenCode cli, OpenCode server, GitHub Copilot CLI over ACP, Codex exec, and Codex app-server. Every transport supports send, wait, status and cancel; in-flight reply and restart resume are available on OpenCode server, Copilot and Codex app-server; parallel fan-out is Copilot's /fleet only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.54" stop-color="#0B1728"/>
      <stop offset="1" stop-color="#0A2221"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1250 190) rotate(135) scale(560 360)">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1290 700) rotate(145) scale(520 280)">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-8%" y="-14%" width="116%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000713" flood-opacity="0.34"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 56px; font-weight: 780; fill: #F8FAFC; }
      .subtitle { font-size: 22px; font-weight: 480; fill: #C8D4E5; }
      .eyebrow { font-size: 15px; font-weight: 780; fill: #5EEAD4; }
      .colhead { font-size: 15px; font-weight: 800; fill: #8FA3BC; letter-spacing: 1.2px; }
      .rowname { font-size: 25px; font-weight: 760; fill: #F8FAFC; }
      .rowsub { font-size: 15px; font-weight: 620; fill: #93A6BD; }
      .cellyes { font-size: 15px; font-weight: 760; fill: #E8F3EE; }
      .cellno { font-size: 16px; font-weight: 640; fill: #64748B; }
      .tagtxt { font-size: 14px; font-weight: 800; fill: #07111F; }
      .foot { font-size: 17px; font-weight: 700; fill: #E2E8F0; }
      .note { font-size: 15px; font-weight: 560; fill: #8FA3BC; }
    </style>
  </defs>

  <rect width="1600" height="850" fill="url(#bg)"/>
  <rect width="1600" height="850" fill="url(#glowBlue)"/>
  <rect width="1600" height="850" fill="url(#glowAmber)"/>

  <text x="104" y="92" class="sans eyebrow">SUPPORTED COMPANIONS</text>
  <text x="104" y="154" class="sans title">Attach your companion</text>
  <text x="104" y="195" class="sans subtitle">Five transports across three runtimes. Capability follows the transport, not the vendor.</text>

  <!-- column headers -->
  <text x="104" y="262" class="sans colhead">COMPANION · TRANSPORT</text>
  <text x="640" y="262" class="sans colhead">CORE</text>
  <text x="1000" y="262" text-anchor="middle" class="sans colhead">REPLY</text>
  <text x="1200" y="262" text-anchor="middle" class="sans colhead">RESTART RESUME</text>
  <text x="1420" y="262" text-anchor="middle" class="sans colhead">PARALLEL</text>
  <path d="M104 280H1496" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round"/>

  <defs>
    <g id="tick">
      <circle cx="0" cy="0" r="13" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.55"/>
      <path d="M-6 0L-2 5L6 -5" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g id="dash">
      <circle cx="0" cy="0" r="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <path d="M-5 0H5" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- row 1 — OpenCode cli -->
  <g filter="url(#shadow)">
    <rect x="104" y="298" width="1392" height="74" rx="20" fill="#0E292B" fill-opacity="0.62" stroke="#2DD4BF" stroke-opacity="0.30"/>
  </g>
  <rect x="104" y="298" width="6" height="74" rx="3" fill="#2DD4BF"/>
  <text x="140" y="329" class="sans rowname">OpenCode · cli</text>
  <text x="140" y="354" class="mono rowsub">opencode run --format json --dir &lt;cwd&gt;   ·   default</text>
  <text x="640" y="341" class="mono cellyes">send · wait · status · cancel</text>
  <g transform="translate(1000 335)"><use href="#dash"/></g>
  <g transform="translate(1200 335)"><use href="#dash"/></g>
  <g transform="translate(1420 335)"><use href="#dash"/></g>

  <!-- row 2 — OpenCode server -->
  <g filter="url(#shadow)">
    <rect x="104" y="386" width="1392" height="74" rx="20" fill="#0E292B" fill-opacity="0.62" stroke="#2DD4BF" stroke-opacity="0.30"/>
  </g>
  <rect x="104" y="386" width="6" height="74" rx="3" fill="#2DD4BF"/>
  <text x="140" y="417" class="sans rowname">OpenCode · server</text>
  <text x="140" y="442" class="mono rowsub">opencode serve over HTTP   ·   OPENCODE_RUNTIME_ADAPTER=server</text>
  <text x="640" y="429" class="mono cellyes">send · wait · status · cancel</text>
  <g transform="translate(1000 423)"><use href="#tick"/></g>
  <g transform="translate(1200 423)"><use href="#tick"/></g>
  <g transform="translate(1420 423)"><use href="#dash"/></g>

  <!-- row 3 — Copilot -->
  <g filter="url(#shadow)">
    <rect x="104" y="474" width="1392" height="74" rx="20" fill="#332309" fill-opacity="0.62" stroke="#F59E0B" stroke-opacity="0.34"/>
  </g>
  <rect x="104" y="474" width="6" height="74" rx="3" fill="#F59E0B"/>
  <text x="140" y="505" class="sans rowname">GitHub Copilot CLI · acp</text>
  <text x="140" y="530" class="mono rowsub">copilot --acp behind a shared daemon   ·   default</text>
  <text x="640" y="517" class="mono cellyes">send · wait · status · cancel</text>
  <g transform="translate(1000 511)"><use href="#tick"/></g>
  <g transform="translate(1200 511)"><use href="#tick"/></g>
  <rect x="1373" y="497" width="94" height="30" rx="15" fill="#FDE68A"/>
  <text x="1420" y="518" text-anchor="middle" class="mono tagtxt">/fleet</text>

  <!-- row 4 — Codex exec -->
  <g filter="url(#shadow)">
    <rect x="104" y="562" width="1392" height="74" rx="20" fill="#171B33" fill-opacity="0.66" stroke="#818CF8" stroke-opacity="0.30"/>
  </g>
  <rect x="104" y="562" width="6" height="74" rx="3" fill="#818CF8"/>
  <text x="140" y="593" class="sans rowname">Codex CLI · exec</text>
  <text x="140" y="618" class="mono rowsub">codex exec --json, one-shot subprocess   ·   CODEX_RUNTIME_ADAPTER=exec</text>
  <text x="640" y="605" class="mono cellyes">send · wait · status · cancel</text>
  <g transform="translate(1000 599)"><use href="#dash"/></g>
  <g transform="translate(1200 599)"><use href="#dash"/></g>
  <g transform="translate(1420 599)"><use href="#dash"/></g>

  <!-- row 5 — Codex app-server -->
  <g filter="url(#shadow)">
    <rect x="104" y="650" width="1392" height="74" rx="20" fill="#171B33" fill-opacity="0.66" stroke="#A78BFA" stroke-opacity="0.52"/>
  </g>
  <rect x="104" y="650" width="6" height="74" rx="3" fill="#A78BFA"/>
  <text x="140" y="681" class="sans rowname">Codex CLI · app-server</text>
  <text x="140" y="706" class="mono rowsub">codex app-server behind a shared broker   ·   what the templates ship</text>
  <text x="640" y="693" class="mono cellyes">send · wait · status · cancel</text>
  <g transform="translate(1000 687)"><use href="#tick"/></g>
  <g transform="translate(1200 687)"><use href="#tick"/></g>
  <g transform="translate(1420 687)"><use href="#dash"/></g>

  <text x="104" y="764" class="sans note">Reply and restart resume are transport properties: the same runtime gains both by moving off a one-shot pipe onto a long-lived server.</text>

  <g filter="url(#shadow)">
    <rect x="104" y="784" width="1392" height="52" rx="26" fill="#F8FAFC" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="136" y="817" class="mono foot">agent_send({ task, cwd, strength? })  ->  agent_wait({ job_id })  ->  agent-digest://&lt;jobId&gt;</text>
  </g>
</svg>
